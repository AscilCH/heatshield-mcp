[project]
name = "heatshield-mcp"
version = "0.1.0"
description = "HeatShield: A GeoAI Urban Heat Wave Safety Assistant (MCP Server)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.1",
    "numpy>=2.4.6",
    "duckdb>=1.5.5",
    "pypdf>=6.14.2",
    "duckduckgo-search>=8.1.1",
    "shapely>=2.0.0",
]

[project.scripts]
heatshield = "heatshield.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heatshield"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
