[project]
name = "heatshield-mcp"
version = "0.1.0"
description = "HeatShield: A GeoAI Urban Heat Wave Safety Assistant (MCP Server)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
heatshield = "heatshield.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heatshield"]
